# Production-enhancer regression fixtures, not authenticated Forgejo or physical iOS acceptance.
name: native-browser

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: native (${{ matrix.browser }})
    # Existing GARM Ubuntu pool: ephemeral isolated guest, 4 vCPU / 6 GiB.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        browser: [chromium, webkit]
    env:
      CI: 'true'
      PLAYWRIGHT_BROWSERS_PATH: '0'
      NODE_OPTIONS: --max-old-space-size=2048
      BROWSER: ${{ matrix.browser }}
      PROJECT: ${{ matrix.browser }}-*
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Record exact source and guest resources
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          mkdir -p .qa
          git rev-parse HEAD > .qa/source-sha.txt
          uname -a
          getconf _NPROCESSORS_ONLN
          free -m
      - run: npm ci --no-audit --no-fund
      - name: Install pinned browser and guest system dependencies
        run: ./node_modules/.bin/playwright install --with-deps "$BROWSER"
      - name: Run production enhancer native fixtures
        run: ./node_modules/.bin/playwright test -c playwright.native.config.mjs --project="$PROJECT"
      - name: Retain reports and failure traces
        if: always()
        # Forgejo supports the v3 artifact protocol, not GitHub's v4 backend.
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32 # v3.1.3
        with:
          name: native-${{ matrix.browser }}-${{ github.sha }}
          path: .qa/
          retention-days: 14
          if-no-files-found: error
