# The repo's own check, next to the rig catalog's secret-scan.yml. Runs on the Forgejo runners
# for every pull request and on pushes to main (a PR branch is covered by its pull_request run).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Tests (generated-file and fingerprint checks, node --test, python unittest)
        run: npm test
