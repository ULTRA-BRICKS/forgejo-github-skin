# rig.yaml — declarative setup for this repo, applied by `rig apply`.
# Global defaults live at ~/.config/rig/config.yaml; this file overrides them.
# Schema: rig-cli docs/config-schema.md

version: 1

# CI on Forgejo (runs-on: ubuntu-latest). The gate from the rig catalog is the ecosystem secret
# scan: gitleaks over the tree on every pull request and on pushes to main. The repo's own ci.yml
# runs npm test (generated-file checks, node and python tests).
ci:
  enabled: true
  all: false
  items:
    secret-scan:
      enabled: true
      tier: block

# Complexity gate (`rig lint check`, machine-wide since rig #775). dist/public/assets/hypergithub/<version>/ holds
# byte-identical release copies of src/*.mjs, and every release adds a new copy of functions that already exceeded the
# default limits (cognitive 15, cyclomatic 20) before the gate existed; refactoring them is not part of a release.
# The limits below are the current worst case of those shipped functions (boot in skin.mjs: cognitive 66, cyclomatic 69),
# so the gate still rejects any function more complex than what already ships. The line-count check keeps its defaults.
lint_checks:
  complexity:
    enabled: true
    max_cognitive: 66
    max_cyclomatic: 69
